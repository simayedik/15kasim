<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>İkimizin Sitesi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFF0F1; --card:#FFFFFF; --ink:#231942; --muted:#6A5A7E; --line:#231942; --shadow:#231942;
  --soft:#FFE1E5; --cherry:#D91E45; --cherry-text:#D91E45; --sun:#FFC93C; --on-accent:#231942; --on-cherry:#FFFFFF;
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-hand:'Caveat','Segoe Script','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark; --bg:#17102B; --card:#251A44; --ink:#FFF0F1; --muted:#BFB1D6; --line:#FFF0F1;
    --shadow:#0B0718; --soft:#33244F; --cherry-text:#FF7C93;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--font-b);-webkit-font-smoothing:antialiased}
.gate{
  min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
form{
  width:100%;max-width:440px;background:var(--card);border:2.5px solid var(--line);border-radius:18px;
  box-shadow:6px 6px 0 var(--shadow);padding:28px 22px;display:flex;flex-direction:column;gap:16px;transform:rotate(-1deg)
}
.stamp{
  align-self:flex-start;font:600 .8rem var(--font-d);letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:var(--on-accent);
  border:2.5px solid var(--line);padding:.3em .8em;border-radius:8px;transform:rotate(-2deg);margin:0
}
h1{margin:0;font:700 clamp(2.2rem,10vw,3rem)/1 var(--font-d);display:flex;align-items:center;gap:.2em}
h1 svg{width:.7em;height:.7em;color:var(--cherry-text);flex:none}
p{margin:0;color:var(--muted)}
label{font:600 1.05rem var(--font-d);color:var(--ink)}
input{
  width:100%;font:600 1.3rem var(--font-d);padding:.6em .8em;border:2.5px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink)
}
input::placeholder{color:var(--muted);opacity:.7}
button{
  font:600 1.1rem var(--font-d);padding:.75em 1.3em;border:2.5px solid var(--line);border-radius:999px;background:var(--cherry);color:var(--on-cherry);
  box-shadow:3px 3px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s
}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
button:disabled{opacity:.7;cursor:wait}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#err{min-height:1.6em;font-weight:700;color:var(--cherry-text)}
form.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotate(-1deg)}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(10px) rotate(-1deg)}60%{transform:translateX(-6px) rotate(-1deg)}80%{transform:translateX(6px) rotate(-1deg)}}
@media (prefers-reduced-motion: reduce){ form.shake{animation:none} }
</style>
</head>
<body>
<main class="gate">
  <form id="f" autocomplete="off">
    <p class="stamp">Sadece ikimize özel</p>

    <p>İçeri girmek için tek bir soru var.</p>
    <label for="a">Sevgili olduğumuz gün? (gün.ay)</label>
    <input id="a" name="a" type="text" inputmode="text" placeholder="gg.aa" maxlength="24" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="b" type="submit">Aç</button>
    <p id="err" role="status" aria-live="polite"></p>
  </form>
</main>

const FAILS = ['Yanlış. Bunu unutmak yasak.', 'Hmm. Şüpheli.', 'Yaklaştın ama hayır.', 'Bir daha düşün, ben beklerim.'];
let tries = 0;

function normalize(s){
  s = String(s).toLocaleLowerCase('tr').replace(/ş/g, 's').replace(/\bsub\w*/g, ' 2 ');
  const n = s.match(/\d+/g) || [];
  let d, m;
  if (n.length >= 2){ d = n[0]; m = n[1]; }
  else if (n.length === 1 && n[0].length >= 4){ d = n[0].slice(0, 2); m = n[0].slice(2, 4); }
  else return '';
  return String(+d).padStart(2, '0') + String(+m).padStart(2, '0');
}
function bytes(b64){ return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

async function unlock(answer){
  const key = normalize(answer);
  if (!key) return null;
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
  const aes = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: bytes(P.s), iterations: 600000, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  try {
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(P.i)}, aes, bytes(P.d));
    return new TextDecoder().decode(plain);
  } catch (e) {
    return null;
  }
}

const f = document.getElementById('f'), a = document.getElementById('a'), b = document.getElementById('b'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle){
    err.textContent = 'Bu tarayıcı şifre çözmeyi desteklemiyor. Sayfayı https adresinden aç.';
    return;
  }
  b.disabled = true; b.textContent = 'Açılıyor…'; err.textContent = '';
  await new Promise(r => setTimeout(r, 40));
  const html = await unlock(a.value);
  if (html){
    document.open(); document.write(html); document.close();
    return;
  }
  b.disabled = false; b.textContent = 'Aç';
  tries++;
  err.textContent = tries >= 4 ? 'Tamam, ipucu: bana sor.' : FAILS[(tries - 1) % FAILS.length];
  f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  a.select();
});
